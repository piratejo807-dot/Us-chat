<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - Application Complète</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Page Styles */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        /* Profile Page Styles */
        .profile-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .profile-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .profile-card .info {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* Chat Page Styles */
        .chat-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.5rem;
        }

        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 70%;
        }

        .message-header {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .message-bubble {
            background: white;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e1e1;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group button {
            padding: 15px 25px;
            border-radius: 25px;
        }

        /* Settings Button */
        .settings-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .login-card, .profile-card {
                margin: 10px;
                padding: 20px;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-container {
                height: 95vh;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h1>Group Chat</h1>
            <p style="margin-bottom: 30px; color: #666;">Entrez votre numéro de matricule</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="matricule">Numéro de matricule</label>
                    <input
                        type="text"
                        id="matricule"
                        placeholder="Ex: 25BS1046"
                        required
                        pattern="[0-9A-Za-z]+"
                    >
                </div>
                <button type="submit" class="btn">Entrer dans le chat</button>
                <div id="loginError" class="error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profilePage" class="profile-container hidden">
        <div class="profile-card">
            <div class="avatar" id="profileAvatar"></div>
            <h2 id="welcomeMessage"></h2>
            <p class="info">Matricule: <span id="profileNumber"></span></p>
            <p class="info">Membre depuis: <span id="memberSince"></span></p>
            <button class="btn" onclick="showChat()">Continuer vers le chat</button>
        </div>
    </div>

    <!-- Chat Page -->
    <div id="chatPage" class="container hidden">
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h2>Group Chat</h2>
                    <p style="margin: 0; opacity: 0.8;">Tous les membres</p>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div class="user-info">
                        <div class="user-avatar" id="headerAvatar"></div>
                        <span id="headerName"></span>
                    </div>
                    <button class="settings-btn" onclick="showSettings()">⚙️ Paramètres</button>
                    <button class="settings-btn" onclick="logout()">🚪 Déconnexion</button>
                </div>
            </div>

            <div class="chat-messages" id="messagesContainer">
                <!-- Messages will be added here -->
            </div>

            <div class="message-input">
                <form id="messageForm" class="input-group">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Tapez votre message..."
                        maxlength="500"
                        required
                    >
                    <button type="submit" class="btn">Envoyer</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Paramètres</h3>
                <button class="close-btn" onclick="closeSettings()">&times;</button>
            </div>

            <div class="form-group">
                <label for="displayName">Nom d'affichage</label>
                <input type="text" id="displayName" placeholder="Votre nom dans le chat">
            </div>

            <div class="form-group">
                <label for="avatarInput">Photo de profil</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>

            <button class="btn mt-20" onclick="saveSettings()">Enregistrer</button>
            <button class="btn mt-20" style="background: #e74c3c;" onclick="clearChatHistory()">Supprimer l'historique</button>
        </div>
    </div>

    <script>
        // User data
        const users = [
            { id: "1", number: "25BS1046", name: "ADJIMON Boyi Conniah" },
            { id: "2", number: "25BS1014", name: "AGBO Débora Exossé" },
            { id: "3", number: "25BS1144", name: "ANANOU Dédé Brunelle Divine" },
            { id: "4", number: "25BS1067", name: "AYISSOU Nathalie Mackenzie" },
            { id: "5", number: "25BS1062", name: "BANKA Sefako Luz" },
            { id: "6", number: "25BS1110", name: "BOLOUVI Jean Pierre Josué Yao" },
            { id: "7", number: "25BS1069", name: "BONI Solkem Ketsia" },
            { id: "8", number: "25BS1060", name: "DIALLO Mariyama Sadio" },
            { id: "9", number: "25BS1132", name: "DICK Komlan Joseph" },
            { id: "10", number: "25BS1057", name: "FOLLY Koffi Dickson" },
            { id: "11", number: "25BS1134", name: "HYDE Karen Elisa Naa Ayoko" },
            { id: "12", number: "25BS1079", name: "KOKOROKO Komi Caphy" },
            { id: "13", number: "25BS1124", name: "LAWSON Kenneth Anani Benjamin" },
            { id: "14", number: "25BS1107", name: "N'DAO Agbani Mathias" },
            { id: "15", number: "25BS1088", name: "PAMAZI Kibandou Gildas" },
            { id: "16", number: "25BS1037", name: "SALEY André Souleymane" },
            { id: "17", number: "25BS1102", name: "TCHIBOZO Enam Solidarde Esmeralda" },
            { id: "18", number: "25BS1084", name: "TIDJANI Saoban" },
            { id: "19", number: "25BS1063", name: "UMAH Chénédu" },
            { id: "20", number: "25BS1104", name: "ZIDDAH Evrard Komivi Dométo" }
        ];

        // Current user and state
        let currentUser = null;
        let messages = [];
        let messageIdCounter = 1;

        // Page navigation
        function showPage(pageId) {
            document.querySelectorAll('[id$="Page"]').forEach(page => {
                page.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }

        // Generate avatar from name
        function getAvatarColor(name) {
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getInitials(name) {
            const words = name.trim().split(/\s+/);
            if (words.length >= 2) {
                return words[0][0] + words[words.length - 1][0];
            }
            return name.substring(0, 2).toUpperCase();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const matricule = document.getElementById('matricule').value.trim();
            const errorDiv = document.getElementById('loginError');

            const user = users.find(u => u.number === matricule);

            if (user) {
                currentUser = { ...user, displayName: user.name };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                // Show profile page
                document.getElementById('welcomeMessage').textContent = `Bienvenue, ${user.name} !`;
                document.getElementById('profileNumber').textContent = user.number;
                document.getElementById('memberSince').textContent = new Date().toLocaleDateString('fr-FR');

                const avatar = document.getElementById('profileAvatar');
                const color = getAvatarColor(user.name);
                const initials = getInitials(user.name);
                avatar.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
                avatar.textContent = initials;

                showPage('profilePage');
                errorDiv.classList.add('hidden');

                // Auto-redirect to chat after 3 seconds
                setTimeout(showChat, 3000);
            } else {
                errorDiv.textContent = 'Numéro non trouvé. Vérifiez votre matricule.';
                errorDiv.classList.remove('hidden');
            }
        });

        // Show chat page
        function showChat() {
            if (!currentUser) return;

            showPage('chatPage');

            // Update header
            document.getElementById('headerName').textContent = currentUser.displayName;
            const headerAvatar = document.getElementById('headerAvatar');
            const color = getAvatarColor(currentUser.name);
            const initials = getInitials(currentUser.name);
            headerAvatar.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
            headerAvatar.textContent = initials;

            // Add welcome message
            addSystemMessage(`${currentUser.name} a rejoint le chat`);

            // Load existing messages or simulate some
            if (messages.length === 0) {
                // Simulate some existing messages
                setTimeout(() => {
                    addMessage(users[1], 'Bonjour tout le monde !', new Date(Date.now() - 300000));
                    addMessage(users[2], 'Salut ! Comment allez-vous ?', new Date(Date.now() - 240000));
                    addMessage(users[3], 'Bienvenue dans le groupe', new Date(Date.now() - 180000));
                }, 1000);
            }
        }

        // Add message to chat
        function addMessage(user, content, timestamp = new Date()) {
            const message = {
                id: messageIdCounter++,
                user: user,
                content: content,
                timestamp: timestamp
            };

            messages.push(message);

            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${user.id === currentUser.id ? 'own' : ''}`;

            const color = getAvatarColor(user.name);
            const initials = getInitials(user.name);

            messageDiv.innerHTML = `
                <div class="message-avatar" style="background: linear-gradient(135deg, ${color}, ${color}dd);">
                    ${initials}
                </div>
                <div class="message-content">
                    <div class="message-header">${user.name} • ${formatTime(timestamp)}</div>
                    <div class="message-bubble">${content}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Add system message
        function addSystemMessage(content) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.style.justifyContent = 'center';

            messageDiv.innerHTML = `
                <div style="background: #e3e3e3; color: #666; padding: 8px 16px; border-radius: 15px; font-size: 14px;">
                    ${content}
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Format time
        function formatTime(date) {
            return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        // Message form handler
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (content && currentUser) {
                addMessage(currentUser, content);
                input.value = '';

                // Simulate response from another user
                if (Math.random() > 0.7) {
                    setTimeout(() => {
                        const randomUser = users.filter(u => u.id !== currentUser.id)[Math.floor(Math.random() * (users.length - 1))];
                        const responses = [
                            'D\'accord !',
                            'Je suis d\'accord',
                            'C\'est intéressant',
                            'Merci pour le partage',
                            'Bien dit !',
                            'Quelle bonne idée !'
                        ];
                        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                        addMessage(randomUser, randomResponse);
                    }, 1000 + Math.random() * 3000);
                }
            }
        });

        // Settings functions
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('displayName').value = currentUser.displayName;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const newDisplayName = document.getElementById('displayName').value.trim();
            if (newDisplayName) {
                currentUser.displayName = newDisplayName;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                // Update UI
                document.getElementById('headerName').textContent = newDisplayName;
                addSystemMessage(`${currentUser.name} a changé son nom d'affichage en "${newDisplayName}"`);
            }

            closeSettings();
        }

        function clearChatHistory() {
            if (confirm('Êtes-vous sûr de vouloir supprimer tout l\'historique du chat ?')) {
                messages = [];
                document.getElementById('messagesContainer').innerHTML = '';
                addSystemMessage('L\'historique du chat a été supprimé');
            }
            closeSettings();
        }

        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                messages = [];
                showPage('loginPage');
                document.getElementById('matricule').value = '';
            }
        }

        // Check for existing session on load
        window.addEventListener('load', function() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showChat();
            }
        });

        // Auto-resize modal content
        window.addEventListener('resize', function() {
            const modal = document.getElementById('settingsModal');
            if (modal.classList.contains('active')) {
                const content = modal.querySelector('.modal-content');
                const maxHeight = window.innerHeight * 0.9;
                content.style.maxHeight = `${maxHeight}px`;
            }
        });
    </script>
</body>
</html>
