<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - Application Corrigée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: none;
            height: 100vh;
        }

        /* Login Page */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-card h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 30px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 35px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #dc3545;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        /* Profile Page */
        .profile-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .profile-card {
            background: white;
            padding: 60px;
            border-radius: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 5px solid white;
            position: relative;
        }

        .profile-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .profile-info {
            color: #666;
            margin-bottom: 35px;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .profile-info p {
            margin: 10px 0;
        }

        /* Chat Page */
        .chat-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .chat-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .control-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fa;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            animation: fadeInUp 0.4s ease;
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .message-content {
            max-width: 70%;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
        }

        .message-header strong {
            color: #333;
            font-weight: 600;
        }

        .message-bubble {
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            word-wrap: break-word;
            transition: all 0.3s ease;
            border: 1px solid #e1e1e1;
        }

        .message-bubble:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .message-input-container {
            padding: 25px 30px;
            background: white;
            border-top: 1px solid #e1e1e1;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 18px 25px;
            border: 2px solid #e1e1e1;
            border-radius: 30px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .input-group button {
            padding: 18px 30px;
            border-radius: 30px;
            font-weight: 600;
            min-width: 120px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success message */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #c3e6cb;
            margin: 20px 0;
            font-size: 16px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .login-card, .profile-card {
                padding: 30px;
            }

            .message-content {
                max-width: 80%;
            }

            .header-controls {
                gap: 10px;
            }

            .control-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="container login-container">
        <div class="login-card">
            <h1>Group Chat</h1>
            <p style="color: #666; font-size: 1.1rem; margin-bottom: 35px;">
                Entrez votre numéro de matricule pour rejoindre le chat
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="matricule">Numéro de matricule</label>
                    <input
                        type="text"
                        id="matricule"
                        placeholder="Ex: 25BS1046"
                        required
                        pattern="[0-9A-Za-z]+"
                    >
                </div>
                <button type="submit" class="btn">Entrer dans le chat</button>
                <div id="loginError" class="error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profilePage" class="container profile-container" style="display: none;">
        <div class="profile-card">
            <div class="avatar" id="profileAvatar"></div>
            <h2 id="welcomeMessage"></h2>
            <div class="profile-info">
                <p>Matricule: <span id="profileNumber"></span></p>
                <p>Membre depuis: <span id="memberSince"></span></p>
            </div>
            <div class="success-message">
                ✅ Connexion réussie !<br>
                <small>Redirection vers le chat dans 3 secondes...</small>
            </div>
        </div>
    </div>

    <!-- Chat Page -->
    <div id="chatPage" class="container" style="display: none;">
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h2>Group Chat</h2>
                    <p style="margin: 5px 0; opacity: 0.9; font-size: 0.9rem;">
                        Discussion de groupe
                    </p>
                </div>
                <div class="header-controls">
                    <div class="user-info">
                        <div class="header-avatar" id="headerAvatar"></div>
                        <span id="headerName"></span>
                    </div>
                    <button class="control-btn" onclick="logout()">🚪</button>
                </div>
            </div>

            <div class="chat-messages" id="messagesContainer">
                <!-- Messages will be added here -->
            </div>

            <div class="message-input-container">
                <form id="messageForm" class="input-group">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Tapez votre message..."
                        maxlength="500"
                        autocomplete="off"
                    >
                    <button type="submit" class="btn">Envoyer</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Données des utilisateurs
        const USERS = [
            { id: "1", number: "25BS1046", name: "ADJIMON Boyi Conniah" },
            { id: "2", number: "25BS1014", name: "AGBO Débora Exossé" },
            { id: "3", number: "25BS1144", name: "ANANOU Dédé Brunelle Divine" },
            { id: "4", number: "25BS1067", name: "AYISSOU Nathalie Mackenzie" },
            { id: "5", number: "25BS1062", name: "BANKA Sefako Luz" },
            { id: "6", number: "25BS1110", name: "BOLOUVI Jean Pierre Josué Yao" },
            { id: "7", number: "25BS1069", name: "BONI Solkem Ketsia" },
            { id: "8", number: "25BS1060", name: "DIALLO Mariyama Sadio" },
            { id: "9", number: "25BS1132", name: "DICK Komlan Joseph" },
            { id: "10", number: "25BS1057", name: "FOLLY Koffi Dickson" },
            { id: "11", number: "25BS1134", name: "HYDE Karen Elisa Naa Ayoko" },
            { id: "12", number: "25BS1079", name: "KOKOROKO Komi Caphy" },
            { id: "13", number: "25BS1124", name: "LAWSON Kenneth Anani Benjamin" },
            { id: "14", number: "25BS1107", name: "N'DAO Agbani Mathias" },
            { id: "15", number: "25BS1088", name: "PAMAZI Kibandou Gildas" },
            { id: "16", number: "25BS1037", name: "SALEY André Souleymane" },
            { id: "17", number: "25BS1102", name: "TCHIBOZO Enam Solidarde Esmeralda" },
            { id: "18", number: "25BS1084", name: "TIDJANI Saoban" },
            { id: "19", number: "25BS1063", name: "UMAH Chénédu" },
            { id: "20", number: "25BS1104", name: "ZIDDAH Evrard Komivi Dométo" }
        ];

        // État de l'application
        let currentUser = null;
        let messages = [];
        let messageIdCounter = 1;

        // Données partagées (simulant une base de données)
        const SHARED_DATA = {
            messages: JSON.parse(localStorage.getItem('chatMessages') || '[]'),
            users: JSON.parse(localStorage.getItem('chatUsers') || JSON.stringify(USERS))
        };

        // Fonctions utilitaires
        function showPage(pageId) {
            console.log('Affichage de la page:', pageId);

            // Cacher toutes les pages
            document.querySelectorAll('[id$="Page"]').forEach(page => {
                page.style.display = 'none';
            });

            // Afficher la page demandée
            document.getElementById(pageId).style.display = 'flex';
        }

        function getAvatarColor(name) {
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getInitials(name) {
            const words = name.trim().split(/\s+/);
            if (words.length >= 2) {
                return words[0][0] + words[words.length - 1][0];
            }
            return name.substring(0, 2).toUpperCase();
        }

        function formatTime(date) {
            return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function saveData() {
            try {
                localStorage.setItem('chatMessages', JSON.stringify(SHARED_DATA.messages));
                localStorage.setItem('chatUsers', JSON.stringify(SHARED_DATA.users));
                console.log('Données sauvegardées');
            } catch (e) {
                console.error('Erreur de sauvegarde:', e);
            }
        }

        // Fonctions pour les messages
        function addMessage(user, content) {
            const message = {
                id: messageIdCounter++,
                userId: user.id,
                userName: user.name,
                content: content,
                timestamp: new Date(),
                type: 'message'
            };

            SHARED_DATA.messages.push(message);
            saveData();
            renderMessage(message);
            return message;
        }

        function addSystemMessage(content) {
            const message = {
                id: messageIdCounter++,
                type: 'system',
                content: content,
                timestamp: new Date()
            };

            SHARED_DATA.messages.push(message);
            saveData();
            renderSystemMessage(message);
        }

        function renderMessage(message) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.userId === currentUser.id ? 'own' : ''}`;

            const user = SHARED_DATA.users.find(u => u.id === message.userId);
            const color = getAvatarColor(user.name);
            const initials = getInitials(user.name);

            messageDiv.innerHTML = `
                <div class="message-avatar" style="background: linear-gradient(135deg, ${color}, ${color}dd);">
                    ${initials}
                </div>
                <div class="message-content">
                    <div class="message-header">
                        <strong>${user.name}</strong>
                        <span>• ${formatTime(message.timestamp)}</span>
                    </div>
                    <div class="message-bubble">${message.content}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function renderSystemMessage(message) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.style.justifyContent = 'center';
            messageDiv.innerHTML = `
                <div style="background: #e9ecef; color: #6c757d; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-style: italic;">
                    ${message.content}
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function loadMessages() {
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = '';

            SHARED_DATA.messages.forEach(message => {
                if (message.type === 'system') {
                    renderSystemMessage(message);
                } else {
                    renderMessage(message);
                }
            });
        }

        // Gestionnaires d'événements
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Tentative de connexion...');

            const matricule = document.getElementById('matricule').value.trim();
            const errorDiv = document.getElementById('loginError');

            const user = SHARED_DATA.users.find(u => u.number === matricule);

            if (user) {
                console.log('Utilisateur trouvé:', user.name);
                currentUser = { ...user, displayName: user.name };

                // Afficher la page de profil
                console.log('Affichage de la page de profil...');
                document.getElementById('welcomeMessage').textContent = `Bienvenue, ${user.name} !`;
                document.getElementById('profileNumber').textContent = user.number;
                document.getElementById('memberSince').textContent = new Date().toLocaleDateString('fr-FR');

                // Mettre à jour l'avatar
                const avatar = document.getElementById('profileAvatar');
                const color = getAvatarColor(user.name);
                const initials = getInitials(user.name);
                avatar.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
                avatar.textContent = initials;

                showPage('profilePage');
                errorDiv.classList.add('hidden');

                console.log('Redirection vers le chat dans 3 secondes...');

                // Auto-redirect vers le chat après 3 secondes
                setTimeout(() => {
                    console.log('Redirection vers le chat...');
                    showChat();
                }, 3000);
            } else {
                console.log('Numéro non trouvé');
                errorDiv.textContent = 'Numéro non trouvé. Vérifiez votre matricule.';
                errorDiv.classList.remove('hidden');
            }
        });

        function showChat() {
            if (!currentUser) {
                console.log('Aucun utilisateur connecté');
                return;
            }

            console.log('Affichage du chat pour:', currentUser.name);
            showPage('chatPage');

            // Mettre à jour l'en-tête
            document.getElementById('headerName').textContent = currentUser.displayName;
            const headerAvatar = document.getElementById('headerAvatar');
            const color = getAvatarColor(currentUser.name);
            const initials = getInitials(currentUser.name);
            headerAvatar.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
            headerAvatar.textContent = initials;

            // Charger les messages existants
            loadMessages();

            // Ajouter message de bienvenue si ce n'est pas déjà fait
            const welcomeMessages = SHARED_DATA.messages.filter(m =>
                m.type === 'system' && m.content.includes(currentUser.name) && m.content.includes('rejoint')
            );

            if (welcomeMessages.length === 0) {
                console.log('Ajout du message de bienvenue');
                addSystemMessage(`${currentUser.name} a rejoint le chat`);
            }

            // Simuler quelques messages de bienvenue
            setTimeout(() => {
                addMessage(SHARED_USERS[1], 'Bonjour tout le monde ! Bienvenue dans le groupe 🎉');
            }, 1000);

            setTimeout(() => {
                addMessage(SHARED_USERS[2], 'Salut ! Content de vous rejoindre 👋');
            }, 2000);
        }

        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                console.log('Déconnexion de:', currentUser.name);

                if (currentUser) {
                    addSystemMessage(`${currentUser.name} a quitté le chat`);
                }

                currentUser = null;
                showPage('loginPage');
                document.getElementById('matricule').value = '';
            }
        }

        // Gestionnaire de messages
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (content && currentUser) {
                console.log('Envoi du message:', content);
                addMessage(currentUser, content);
                input.value = '';

                // Simuler des réponses aléatoires
                if (Math.random() > 0.6) {
                    setTimeout(() => {
                        const randomUser = SHARED_DATA.users.filter(u => u.id !== currentUser.id)[Math.floor(Math.random() * (SHARED_DATA.users.length - 1))];
                        const responses = [
                            'D\'accord !',
                            'Je suis d\'accord',
                            'C\'est intéressant',
                            'Merci pour le partage',
                            'Bien dit !',
                            'Quelle bonne idée !',
                            'Absolument !',
                            'Je pense la même chose'
                        ];
                        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                        addMessage(randomUser, randomResponse);
                    }, 1000 + Math.random() * 3000);
                }
            }
        });

        // Initialisation
        console.log('Initialisation de l\'application...');

        // Vérifier l'état des pages
        const loginPage = document.getElementById('loginPage');
        const profilePage = document.getElementById('profilePage');
        const chatPage = document.getElementById('chatPage');

        console.log('Pages trouvées:', {
            login: loginPage ? '✅' : '❌',
            profile: profilePage ? '✅' : '❌',
            chat: chatPage ? '✅' : '❌'
        });

        // Assurer que seule la page de login est visible au départ
        showPage('loginPage');

        // Charger les données sauvegardées
        loadMessages();

        console.log('Application initialisée et prête !');
    </script>
</body>
</html>
